<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="header-row">
      <button id="pr-menu-btn" class="burger" title="Switch pull request">
        <span></span><span></span><span></span>
      </button>
      <img class="logo" src="icons/icon-48.png" alt="">
      <div class="brand">PR Buddy</div>
      <div class="spacer"></div>
      <span id="new-pill" class="new-pill" hidden></span>
      <button id="refresh" class="hbtn" title="Check GitHub for updates now">Sync</button>
      <button id="open-options" class="hbtn" title="Settings">Settings</button>
    </div>
    <button id="pr-head" class="pr-head" hidden title="Switch pull request">
      <div id="current-title" class="pr-title"></div>
      <div id="current-crumb" class="pr-crumb"></div>
    </button>
    <div id="pr-dropdown" hidden>
      <div class="dd-head">
        <span>Switch pull request</span>
        <button id="dd-close" title="Close">×</button>
      </div>
      <div id="others-list"></div>
      <div class="dd-foot">
        <input id="pr-url-input" placeholder="Paste a GitHub PR URL to open…" spellcheck="false">
      </div>
    </div>
  </header>

  <!-- Search lives *on top of* the filter row rather than in a row of its own:
       the popup is height-capped, so every permanent row is a card we lose. -->
  <div id="filter-row" hidden>
    <button id="search-btn" title="Search (/)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
    </button>
    <div id="filter-bar"></div>
    <div id="search-overlay" hidden>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
      <input id="search-input" placeholder="Search files, comments, people…" spellcheck="false" autocomplete="off">
      <span id="result-label" hidden></span>
      <button id="search-close" title="Close search">×</button>
    </div>
  </div>
  <div id="who-bar" hidden>
    <div id="who-stack" class="who-stack"></div>
    <div id="who-summary" class="who-summary"></div>
    <button id="who-clear" class="who-clear" hidden>Clear</button>
  </div>
  <div id="list-meta" class="list-meta" hidden>
    <span id="visible-label"></span>
    <button id="sort-toggle"></button>
  </div>

  <main id="content">
    <div id="outline"></div>
    <div id="no-current" class="empty" hidden></div>
  </main>

  <footer>
    <span class="hint"><b>J K</b> move</span>
    <span class="hint"><b>↵</b> expand</span>
    <span class="hint"><b>G</b> go</span>
    <span class="spacer"></span>
    <span id="status"></span>
    <span id="resolved-summary"></span>
  </footer>
  <div id="resize-handle" title="Drag to resize"></div>
  <script src="sizing.js"></script>
  <script src="cache.js"></script>
  <script src="popup.js"></script>
</body>
</html>
